 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/10-rock.css">
    <title>RPS using function</title>
</head>

<body>

    <p class="title">Rock Paper Scissors</p>

    <button 
    class="rock-button"
    onclick="playGame('rock')" ><img class="rock-image"  src="images/rock-emoji.png" alt="rock-image"></button>

    <button 
    class="paper-button"
    onclick="playGame('paper')">
    <img src="images/paper-emoji.png"
     alt="paper-image"
    class="paper-image">
  </button>

    <button 
    class="scissor-button"
    onclick="playGame('scissors')">
    <img src="images/scissors-emoji.png" 
    alt="scissor-image" 
    class="scissor-image">
    </button>

    <p class="js-result"></p>
    <p class="js-moves"></p>

    <p class="js-score"></p>
    <button 
    class="reset-button"
    onclick="
    score.wins =0;
    score.losses =0;
    score.ties =0;
    localStorage.removeItem('score')
    updateScoreElement();
    ">Reset Score</button>

     

    <script>
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins:0,
            losses:0,
            ties:0
        };

        updateScoreElement();
/*
        if(!score)
    {
        score ={
            wins:0,
            losses:0,
            ties:0
        };
    }*/
         

        function playGame(playerMove) {

            const computermove = pickComputermove();
            let result = '';

            if (playerMove === 'rock') {

                if (computermove === 'rock') {
                    result = 'tie';
                }
                else if (computermove === 'paper') {
                    result = 'you lose';
                }
                else if (computermove === 'scissors') {
                    result = 'you win';
                }

            }

            else if (playerMove === 'paper') {

                if (computermove === 'paper') {
                    result = 'tie';
                }
                else if (computermove === 'scissors') {
                    result = 'you lose';
                }
                else if (computermove === 'rock') {
                    result = 'you win';
                }

            }

            else if (playerMove === 'scissors') {

                if (computermove === 'scissors') {
                    result = 'tie';
                }
                else if (computermove === 'rock') {
                    result = 'you lose';
                }
                else if (computermove === 'paper') {
                    result = 'you win';
                }

            }
            if(result === 'you win')
            {
                score.wins +=1;
            }
            else if (result ==='you lose')
            {
                score.losses +=1;
            }
            else if (result === 'tie'  )
            {
                score.ties +=1;
            }

            localStorage.setItem('score' , JSON.stringify(score));

            document.querySelector('.js-score')
        .innerHTML=`wins:${score.wins} losses:${score.losses} tie:${score.ties}`;
            updateScoreElement();

            document.querySelector('.js-result').innerHTML= 'result';

            document.querySelector('.js-moves').innerHTML = `You ${playerMove} -${computermove} Computer `;
 
        

        }

        function updateScoreElement()
        {
            document.querySelector('.js-score')
        .innerHTML=`wins:${score.wins} losses:${score.losses} tie:${score.ties}`;
        }


        function pickComputermove() {

            const randomnumber = Math.random();
            let computermove = '';

            if (randomnumber < 1 / 3) {
                computermove = 'rock';
            }
            else if (randomnumber < 2 / 3) {
                computermove = 'paper';
            }
            else {
                computermove = 'scissors';
            }

            return computermove;
        }

    </script>

</body>
</html>
