 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/10-rock.css">
    <title>RPS using function</title>
</head>

<body>

    <p class="title">Rock Paper Scissors</p>

    <button 
    class="rock-button"
    onclick="playGame('rock')" ><img class="rock-image"  src="images/rock-emoji.png" alt="rock-image"></button>

    <button 
    class="paper-button"
    onclick="playGame('paper')">
    <img src="images/paper-emoji.png"
     alt="paper-image"
    class="paper-image">
  </button>

    <button 
    class="scissor-button"
    onclick="playGame('scissors')">
    <img src="images/scissors-emoji.png" 
    alt="scissor-image" 
    class="scissor-image">
    </button>

    <p class="js-result"></p>
    <p class="js-moves"></p>

    <p class="js-score"></p>
    <button 
    class="reset-button"
    onclick="
    score.wins =0;
    score.losses =0;
    score.ties =0;
    localStorage.removeItem('score')
    updateScoreElement();
    ">Reset Score</button>

     

    <script src="script/10-rock-paper-scissors.js">
    </script>

</body>
</html>
