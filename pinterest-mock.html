 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Clone</title>
    <link rel="stylesheet" href="css/pinterest.css">
</head>

<body>

    <header>
        <div class="logo">Pinterest</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Explore</a>
            <a href="#">Create</a>
        </nav>

        <input id="searchInput" type="text" placeholder="Search">

        <button id="searchBtn">Search</button>
    </header>

    <main>

        <div class="title">
            <h1>Ideas for you</h1>
            <p>Find something you love</p>
        </div>

        <div id="pinsContainer" class="pins-container"></div>

    </main>

    <script src="script/pinterest.js"></script>

</body>
</html>
