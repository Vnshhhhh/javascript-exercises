  <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon-shipping-calc</title>
</head>

<body>

    <p>Amazon shipping calculator</p>
    <input class="js-cost-input" 
    type="text"
     placeholder="cost of order " 
      onkeydown="
      handleCostKeyDown(event);
  
    ">

    <button onclick="
        calculateTotal();
    ">Calculate</button>

    <p class="total-cost">
    
    </p>

    <script>
       

        function handleCostKeyDown()
        {
            if( event.key === 'Enter')
        {
            calculateTotal();
        }

        }

        function calculateTotal(event)
         {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value); //number function
       
            if (cost < 40) {
                cost = cost + 10;
            }
            cost =Math.round(cost * 100) /100;//hepls us to calculate the deciaml no. because the computer are very bad with decimal no. calculation1111
            document.querySelector('.total-cost')
                .innerHTML = `$${cost .toFixed(2)}`;
        }

        

    </script>

</body>

</html>
