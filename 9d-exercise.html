<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9d</title>
</head>
<body>

    <input type="text" 
    placeholder="Enter your Name" 
    class="namePrint" 
    onkeydown="if(event.key === 'Enter') nameDisplay()">

   

    <button onclick=" nameDisplay()">Submit</button>

    <script>
        function nameDisplay()
        {
             const name = document.querySelector('.namePrint').value ;
             /*we use value so that we can get the value entered by the user*/
             console.log(`your name is ${name}`)
           

        }
    
    </script>
    
</body>
</html>
