 </head>
 <body>
    <button
    onclick="
    let randomNum = Math.random();

    console.log( 'computer:'+ computerMove);

    let result =computerMove === 'Heads' ? 'you win' : 'you lose';
    console.log('result:' + result);
    
    "
    >Heads</button>

     <button
    onclick="
    let randomNum = Math.random();

    console.log( 'computer:'+ computerMove);

    let result =computerMove === 'Tails' ? 'you win' : 'you lose';

    "
