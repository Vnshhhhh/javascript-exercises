<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black & White Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #111;
            border: 2px solid #fff;
            border-radius: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 15px;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .display {
            width: 100%;
            height: 80px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;

            font-size: 32px;
            text-align: right;
            padding: 15px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: 2px solid #fff;
            border-radius: 10px;

            background: #000;
            color: #fff;

            font-size: 20px;
            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        .operator {
            background: #fff;
            color: #000;
        }

        .operator:hover {
            background: #000;
            color: #fff;
        }

        .clear {
            grid-column: span 2;
        }

        .equal {
            background: #fff;
            color: #000;
        }

        .equal:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="title">
            CALCULATOR
        </div>

        <input 
            type="text" 
            class="display" 
            id="display" 
            value="0"
            readonly
        >

        <div class="buttons">

            <button class="clear" onclick="calculator.clear()">C</button>
            <button onclick="calculator.delete()">⌫</button>
            <button class="operator" onclick="calculator.chooseOperator('/')">÷</button>

            <button onclick="calculator.addNumber('7')">7</button>
            <button onclick="calculator.addNumber('8')">8</button>
            <button onclick="calculator.addNumber('9')">9</button>
            <button class="operator" onclick="calculator.chooseOperator('*')">×</button>

            <button onclick="calculator.addNumber('4')">4</button>
            <button onclick="calculator.addNumber('5')">5</button>
            <button onclick="calculator.addNumber('6')">6</button>
            <button class="operator" onclick="calculator.chooseOperator('-')">−</button>

            <button onclick="calculator.addNumber('1')">1</button>
            <button onclick="calculator.addNumber('2')">2</button>
            <button onclick="calculator.addNumber('3')">3</button>
            <button class="operator" onclick="calculator.chooseOperator('+')">+</button>

            <button onclick="calculator.addNumber('0')">0</button>
            <button onclick="calculator.addNumber('.')">.</button>
            <button class="equal" onclick="calculator.calculate()">=</button>

        </div>

    </div>


    <script>

        // Calculator Object
        const calculator = {

            currentNumber: '',
            previousNumber: '',
            operator: null,

            // Add number to display
            addNumber: function(number) {

                // Prevent multiple decimal points
                if (number === '.' && this.currentNumber.includes('.')) {
                    return;
                }

                this.currentNumber += number;

                this.updateDisplay();
            },


            // Choose mathematical operator
            chooseOperator: function(operator) {

                if (this.currentNumber === '') {
                    return;
                }

                // If calculation is already waiting,
                // calculate it first
                if (this.previousNumber !== '') {
                    this.calculate();
                }

                this.operator = operator;

                this.previousNumber = this.currentNumber;

                this.currentNumber = '';

                this.updateDisplay();
            },


            // Perform calculation
            calculate: function() {

                if (
                    this.previousNumber === '' ||
                    this.currentNumber === '' ||
                    this.operator === null
                ) {
                    return;
                }

                let firstNumber = parseFloat(this.previousNumber);
                let secondNumber = parseFloat(this.currentNumber);

                let result;


                // Object containing operations
                const operations = {

                    '+': function(a, b) {
                        return a + b;
                    },

                    '-': function(a, b) {
                        return a - b;
                    },

                    '*': function(a, b) {
                        return a * b;
                    },

                    '/': function(a, b) {

                        if (b === 0) {
                            return 'Error';
                        }

                        return a / b;
                    }
                };


                result = operations[this.operator](
                    firstNumber,
                    secondNumber
                );


                this.currentNumber = result.toString();

                this.previousNumber = '';

                this.operator = null;

                this.updateDisplay();
            },


            // Clear calculator
            clear: function() {

                this.currentNumber = '';
                this.previousNumber = '';
                this.operator = null;

                this.updateDisplay();
            },


            // Delete last number
            delete: function() {

                this.currentNumber =
                    this.currentNumber.slice(0, -1);

                this.updateDisplay();
            },


            // Update display
            updateDisplay: function() {

                const display =
                    document.getElementById('display');

                if (this.currentNumber === '') {

                    if (this.previousNumber !== '') {
                        display.value = this.previousNumber;
                    } else {
                        display.value = '0';
                    }

                } else {

                    display.value = this.currentNumber;

                }
            }
        };


        // Keyboard support
        document.addEventListener('keydown', function(event) {

            const key = event.key;

            if (key >= '0' && key <= '9') {
                calculator.addNumber(key);
            }

            else if (key === '.') {
                calculator.addNumber('.');
            }

            else if (
                key === '+' ||
                key === '-' ||
                key === '*' ||
                key === '/'
            ) {
                calculator.chooseOperator(key);
            }

            else if (key === 'Enter' || key === '=') {
                calculator.calculate();
            }

            else if (key === 'Escape') {
                calculator.clear();
            }

            else if (key === 'Backspace') {
                calculator.delete();
            }

        });

    </script>

</body>
</html>
